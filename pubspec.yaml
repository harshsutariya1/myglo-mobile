name: myglo
description: "A new MyGlo Mobile app project."

publish_to: "none"

version: 1.0.0+3

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.4
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  json_annotation: any
  shared_preferences: ^2.5.5
  flutter_dotenv: ^6.0.1
  sentry_flutter: ^9.20.0
  image_picker: ^1.2.2
  freezed_annotation: any
  riverpod_annotation: any
  cached_network_image: ^3.4.1
  shorebird_code_push: ^2.0.6
  restart_app: ^1.8.3
  flutter_image_compress: ^2.4.0
  uuid: ^4.5.3
  path_provider: ^2.1.6
  readmore: ^3.0.0
  geocoding: ^5.0.0
  logger: ^2.8.0
  connectivity_plus: ^7.3.1
  http: ^1.6.0
  pinput: ^6.0.2
  firebase_core: ^4.15.0
  google_maps_flutter: ^2.18.1
  geolocator: ^14.0.1
  firebase_messaging: ^16.7.0
  url_launcher: ^6.3.3
  flutter_stripe: ^14.2.0

dev_dependencies:
  sentry_dart_plugin: ^3.4.0
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  json_serializable: any
  freezed: any
  build_runner: any
  riverpod_generator: any
  mocktail: ^1.0.5

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/graphics/
    - assets/logo/
    - assets/images/avatars/
    - assets/images/
    - shorebird.yaml

  fonts:
    - family: Mulish
      fonts:
        - asset: assets/fonts/mulish/Mulish-Light.ttf
          weight: 300
        - asset: assets/fonts/mulish/Mulish-Regular.ttf
          weight: 400
        - asset: assets/fonts/mulish/Mulish-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/mulish/Mulish-Medium.ttf
          weight: 500
        - asset: assets/fonts/mulish/Mulish-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/mulish/Mulish-Bold.ttf
          weight: 700
        - asset: assets/fonts/mulish/Mulish-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/mulish/Mulish-Black.ttf
          weight: 900

sentry:
  upload_debug_symbols: true
  upload_source_maps: false
  upload_sources: false
  project: myglo-app
  org: nexotec-technologies
